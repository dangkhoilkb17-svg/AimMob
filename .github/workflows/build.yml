name: Build

on:
  push:
    paths:
      - "HeadAim-1.1.0/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "HeadAim-1.1.0/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HeadAim-1.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bash ./gradlew build
